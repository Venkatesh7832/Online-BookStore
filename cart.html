<!DOCTYPE html>
<html>
<head>
  <title>Book Haven - Add to Cart</title>
  <link rel="stylesheet" href="cart.css">
</head>
<body>
  <script>
    let Items = [];

    function addToCart(title, price) {
      Items.push({ title, price });
      update();
    }

    function update() {
      const cartList = document.getElementById('items');
      const total = document.getElementById('totalamount');
      let totalamount = 0;
      cartList.innerHTML = '';

      Items.forEach(item => {
        const listItem = document.createElement('li');
        listItem.textContent = `${item.title} - ₹${item.price}`;
        cartList.appendChild(listItem);
        totalamount += item.price;
      });

      total.textContent = `Total Amount: ₹${totalamount}`;
    }

    function submitCart() {
      alert('Cart submitted successfully!');
    }
  </script>

  <header>
    📚 Welcome to Book Haven - Shop Books
  </header>

  <table>
    <tr align="center">
      <th>Image</th>
      <th>Title</th>
      <th>Price</th>
      <th>Add to Cart</th>
    </tr>
    <tr align="center">
      <td><img src="images/Atomic_Habits.jpg" width="100" alt="Book1"></td>
      <td>Atomic_Habits</td>
      <td>₹599</td>
      <td><button onclick="addToCart('Atomic Habits', 599)">Click Here</button></td>
    </tr>
    
    
    <tr align="center">
      <td><img src="images/Alchemist.jpeg" width="100" alt="Book4"></td>
      <td>The Alchemist/td>
      <td>₹389</td>
      <td><button onclick="addToCart('The Alchemist', 389)">Click Here</button></td>
    </tr>
    <tr align="center">
      <td><img src="images/Rich_Dad.jpeg" width="100" alt="Book5"></td>
      <td>Rich_Dad Poor Dad</td>
      <td>₹329</td>
      <td><button onclick="addToCart('Rich Dad poor dad', 329)">Click Here</button></td>
    </tr>
    <tr align="center">
      <td><img src="images/Ikigai.jpeg" width="100" alt="Book6"></td>
      <td>Ikigai</td>
      <td>₹489</td>
      <td><button onclick="addToCart('Ikigai', 489)">Click Here</button></td>
    </tr>
  </table>

  <div id="cart">
    <h2>Your Cart</h2>
    <ul id="items"></ul>
    <p id="totalamount">Total Amount: ₹0</p>
    <button onclick="submitCart()">Submit</button>
  </div>

</body>
</html>


<html >
<head>
  <title>Login Page</title>
  <link rel="stylesheet" href="login.css" >
</head>
<body>

  <div class="login-box">
    <h1>Login</h1>
    <form name="login" action="home.html" method="post">
      <label>Username:</label>
      <input name="uname" type="text" placeholder="email/username" required><br><br>
      <label>Password:</label>
      <input type="password" name="pwd" placeholder="At least 8 characters" required><br><br>

      <div class="forgot">
        <a href="#">Forgot Password?</a><br><br>
      </div>

      <input type="submit" name="Login" value="Login">
    </form>
  </div>

</body>
</html>

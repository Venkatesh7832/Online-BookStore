<!DOCTYPE html>
    <head>
        <title>Registration Form Validation using js</title>
        <style>
            div{
                box-sizing: border-box;
                width: 100%;
              /*   border: 1px solid black;    */ 
                float: left;
                align-content: center;
                align-items: center;
            }
            form{
                margin: 0 auto;
                width: 600px;
            }
        </style>
        <script type="text/javascript">
            function validateform(){
                var name = document.myform.Username.value;
                var password = document.myform.pwd.value;
                var password2 = document.myform.confirmpwd.value;
                var email = document.myform.email.value;
                var phone = document.myform.phno.value;

                //Javascript reGex for Email Validation.
                var regEmail=/^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/g; 
                // Javascript reGex for Phone Number validation.
                var regPhone=/^\d{10}$/;                       
                // Javascript reGex for Name validation
                var regName = /\d+$/g;  

                if(name==null || regName.test(name)){
                    window.alert("Name can't be empty");
                    name.focus();
                    return false;
                }else if(password=="" || password.length<8){
                    window.alert("Password must be atleast 8 characters");
                    password.focus();
                    return false;
                }else if(password2=="" || password2!=password){
                    window.alert("Please check and confirm your password again!!");
                    password2.focus();
                    return false;
                }else if(!regPhone.test(phone)){
                    window.alert("Please check your phone number");
                    phone.focus();
                    return false;
                }else if(email=="" || !regEmail.test(email)){
                    window.alert("Please enter your email/ incorrect email id");
                    email.focus();
                    return false;
                }
                return true;
            }
        </script>
    </head>
    <body >
        <h1 style="text-align: center;">Registration Form</h1>
        <div style="align-items: center;">
            <form name="myform" method="post" onsubmit="return validateform()">
            <label >Username : </label>
            <input type="text" name="Username" ><br><br>
            <p>Password :
                 <input type="password" name="pwd"><br><br></p>
            <p>Confirm Password :
                 <input type="password" name="confirmpwd"><br/><br/></p>
            <p>Email :
                 <input type="text" name="email" > <br/><br/></p>
            <p>Phone Number :
                 <input type="number" name="phno" > <br/><br/> </p>
            <p>Address :
                 <input type="textarea" name="addr" > <br/><br/></p>
            <p>Select Your course <select >
                <option value="option">option</option>
                <option value="btech"> BTech</option>
                <option value="BBA">BBA</option>
                <option value="mtech">MTech</option>
                <option value="BSc">BSc</option>
                <option value="B.Com">B.Com</option>
            </select> <br/><br/></p>
            <p>
                Comments : <input type="text" name="Comments">
            </p>
            <input type="submit" value="Register" >
        </form>
        </div>
        
    </body> 
</html>
